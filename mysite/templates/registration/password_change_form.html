{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Change password{% endblock %}

{% block breadcrumbs %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{% url 'accounts:profile' %}">Settings</a></li>
    <li class="breadcrumb-item active" aria-current="page">Change password</li>
  </ol>
</nav>
{% endblock %}

{% block content %}
<div class="page-header"><h1 class="page-title">Change password</h1></div>
<div class="card" style="max-width: 720px">
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form|crispy }}
      <div class="d-flex justify-content-end gap-2 pt-3 border-top mt-3">
        <a class="btn btn-outline-secondary" href="{% url 'accounts:profile' %}">Cancel</a>
        <button type="submit" class="btn btn-primary">Change password</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
