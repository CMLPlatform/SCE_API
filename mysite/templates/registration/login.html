{% extends "auth_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Log in{% endblock %}

{% block content %}
<h1 class="h3 fw-normal mb-1">Log in</h1>
<p class="text-secondary mb-4">Sustainability and Cost Evaluator</p>
<form method="post" novalidate>
  {% csrf_token %}
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  {{ form|crispy }}
  <button type="submit" class="btn btn-primary w-100 justify-content-center mt-2">Log in</button>
</form>
<div class="d-flex justify-content-between flex-wrap gap-2 mt-4">
  <a href="{% url 'password_reset' %}">Forgot your password?</a>
  <a href="{% url 'accounts:signup' %}">Create an account</a>
</div>
{% endblock %}
