{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<h2 class="text-2xl font-semibold">Log In</h2>
<div class="px-2 py-4">
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="px-4 py-2 bg-blue-500 text-white font-bold rounded hover:bg-blue-700 transition">Log In</button>
  </form>
  <a href="{% url 'signup' %}" class="px-4 py-2 bg-black text-white font-bold rounded hover:bg-blue-900 transition">Sign Up</a>
</div>
{% endblock %}
