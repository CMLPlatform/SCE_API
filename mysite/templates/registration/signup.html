{% extends "auth_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Create an account{% endblock %}

{% block content %}
<h1 class="h3 fw-normal mb-1">Create an account</h1>
<p class="text-secondary mb-4">Sustainability and Cost Evaluator</p>
<form method="post" novalidate>
  {% csrf_token %}
  {{ form|crispy }}
  <button type="submit" class="btn btn-primary w-100 justify-content-center mt-2">Create account</button>
</form>
<p class="mt-4 mb-0">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
