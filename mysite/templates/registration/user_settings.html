{% extends "base.html" %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}User Settings{% endblock %}

{% block content %}
<div class="settings-form">
  <h1 class="text-2xl font-semibold">User Settings</h1>

  <!-- User Info Form -->
  <form method="post" action="{% url 'accounts:profile' %}">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit"
            class="rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500">
      Save changes
    </button>
  </form>

  <!-- Password Reset Section -->
  <hr class="my-4">
  <h2 class="font-bold">Password</h2>
  <p>Want to change your password?</p>
  <a href="{% url 'password_change' %}"
     class="bg-orange-700 hover:bg-orange-800 text-white font-bold py-2 px-4 rounded mr-2">
    Reset Password
  </a>
</div>
{% endblock %}
