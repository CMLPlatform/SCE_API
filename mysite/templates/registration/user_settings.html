{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Settings{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Settings</h1>
    <p class="page-subtitle">Your account details</p>
  </div>
</div>

<div class="card mb-4" style="max-width: 720px">
  <div class="card-header">Profile</div>
  <div class="card-body">
    <form method="post" action="{% url 'accounts:profile' %}" novalidate>
      {% csrf_token %}
      {{ form|crispy }}
      <div class="d-flex justify-content-end pt-3 border-top mt-3">
        <button type="submit" class="btn btn-primary">Save changes</button>
      </div>
    </form>
  </div>
</div>

<div class="card" style="max-width: 720px">
  <div class="card-header">Password</div>
  <div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">
    <span class="text-secondary">Change the password you use to log in.</span>
    <a class="btn btn-outline-secondary" href="{% url 'password_change' %}"><i class="bi bi-key" aria-hidden="true"></i>Change password</a>
  </div>
</div>
{% endblock %}
