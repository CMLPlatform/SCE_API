{% extends "auth_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Forgot your password?{% endblock %}

{% block content %}
<h1 class="h3 fw-normal mb-1">Forgot your password?</h1>
<p class="text-secondary mb-4">Enter your email address and we'll send you a link to set a new one.</p>
<form method="post" novalidate>
  {% csrf_token %}
  {{ form|crispy }}
  <button type="submit" class="btn btn-primary w-100 justify-content-center mt-2">Send reset link</button>
</form>
<p class="mt-4 mb-0"><a href="{% url 'login' %}">Back to log in</a></p>
{% endblock %}
