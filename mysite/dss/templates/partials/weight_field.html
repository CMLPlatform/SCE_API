{% comment %}
  Partial: weight_field.html
  Variables: field (WeightField), label, range (boolean)
{% endcomment %}
<div>
  <label for="{{ field.id_for_label }}" class="form-label">{{ label }}</label>
  <input type="text"
         id="{{ field.id_for_label }}"
         name="{{ field.html_name }}"
         value="{{ field.value|default:'' }}"
         placeholder="e.g. {% if range %}0.2, 0.8{% else %}0.5{% endif %}"
         class="form-control{% if field.errors %} is-invalid{% endif %}">
  {% if field.errors %}<div class="invalid-feedback">{{ field.errors|join:", " }}</div>{% endif %}
</div>
