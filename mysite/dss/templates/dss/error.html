{% extends "base.html" %}
{% block title %}Analysis failed{% endblock %}

{% block content %}
<div style="max-width: 720px">
  <div class="page-header">
    <div>
      <p class="text-secondary small text-uppercase fw-medium mb-1">Decision support</p>
      <h1 class="page-title">Analysis failed</h1>
      <p class="page-subtitle">The calculation stopped with this error:</p>
    </div>
  </div>
  <div class="alert alert-danger font-monospace small" role="alert">{{ error }}</div>
  <p>Go back to the previous step with your browser's back button and adjust the settings.</p>
</div>
{% endblock %}
